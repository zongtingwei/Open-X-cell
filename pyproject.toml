[project]
name = "lingshu-cell-reproduction"
version = "0.1.0"
description = "Paper-level runnable reproduction of Lingshu-Cell."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
data = [
  "anndata",
  "pandas",
  "scipy",
]
metrics = [
  "scikit-learn",
  "scipy",
]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

