name: xcell
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # PyTorch CPU build (project verification runs on CPU).
      # For CUDA, replace with: torch==2.7.1 --index-url https://download.pytorch.org/whl/cu118
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.7.1
      - numpy>=1.24
      - pandas
      - scipy
      - anndata
      - scikit-learn
      - pytest
      # install Open-X-Cell itself in editable mode
      - -e .
